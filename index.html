<!doctype html>
<html lang="ko" class="notranslate" translate="no">
  <head>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        alert(
          "🔴 [런타임 에러 발생]\n\n" +
          "• 메시지: " + message + "\n" +
          "• 파일: " + source + "\n" +
          "• 라인: " + lineno + ":" + colno + "\n" +
          "• 에러 객체: " + (error ? error.stack : "없음") + "\n\n" +
          "이 화면을 캡처하여 전달해 주세요."
        );
        return false;
      };
      window.onunhandledrejection = function(event) {
        var reason = event.reason;
        var msg = reason ? (reason.message || JSON.stringify(reason)) : "알 수 없는 비동기 에러";
        var stack = reason && reason.stack ? reason.stack : "없음";
        alert(
          "🔴 [비동기 프로미스 거부 에러]\n\n" +
          "• 원인: " + msg + "\n" +
          "• Stack Trace:\n" + stack + "\n\n" +
          "이 화면을 캡처하여 전달해 주세요."
        );
      };
    </script>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/png" href="/logo_n.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>노벨 세무회계 연구</title>
    <!-- Open Graph / KakaoTalk Share Preview Metadata -->
    <meta property="og:title" content="노벨 세무회계 연구" />
    <meta property="og:description" content="노벨 세무회계 연구 관리자 포털 - TAX & ACCOUNTING" />
    <meta property="og:image" content="/logo_n.png" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
